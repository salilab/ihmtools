name: test and publish

# Publishing is wired to PyPI via trusted publishing, which matches on the
# repository and on this file's name -- renaming it breaks authentication.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, then every other release up to the newest.
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[test]'

      - name: Test
        run: pytest -q

      - name: Both CLIs load and their help works
        run: |
          ihmv --help > /dev/null
          ihmdep --help > /dev/null

  build:
    # Only for a version tag, and only once the tests have passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Tag must match the version in pyproject.toml and the package
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          package=$(python -c "import ast; t = ast.parse(open('src/ihmtools/__init__.py').read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'))")
          if [ "$tag" != "$version" ] || [ "$tag" != "$package" ]; then
            echo "tag $GITHUB_REF_NAME, pyproject.toml $version and __version__ $package must agree" >&2
            exit 1
          fi
          echo "publishing $version"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check the artifacts
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # Trusted publishing, matched on this file's name.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # no secrets needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
