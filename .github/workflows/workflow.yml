name: test and publish

# Publishing is wired to TestPyPI via trusted publishing, which matches on the
# repository and on this file's name -- renaming it breaks authentication.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e '.[test]'

      - name: Test
        run: pytest -q

      - name: Both CLIs load and their help works
        run: |
          ihmv --help > /dev/null
          ihmdep --help > /dev/null

  build:
    # Only for a version tag, and only once the tests have passed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag must match the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version" >&2
            exit 1
          fi
          echo "publishing $version"

      - name: Build
        run: |
          pip install build
          python -m build

      - name: Check the artifacts
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Both indexes use trusted publishing, matched on this file's name.
  testpypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # no secrets needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # a version already tried on TestPyPI must not fail the release
          skip-existing: true

  pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
